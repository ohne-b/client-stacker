name: Feature request
description: Suggest a focused improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the situation and the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do currently?
      description: Include other mods involved, if relevant.
